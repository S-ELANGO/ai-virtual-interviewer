services:
  - type: web
    name: ai-interviewer-backend
    env: python
    region: singapore # Optional: defaults to Oregon, change if needed
    plan: free # Optional: defaults to starter
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/serviceAccountKey.json
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # User must enter this in dashboard
    secretFiles:
      - key: serviceAccountKey.json
        content: $FIREBASE_SERVICE_ACCOUNT_JSON
